<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>破山门 · 宗门模拟器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#2b3a33; --sub:#6d7d72; --sea:#1d635c; --sea2:#2e8a78; --jade:#3d9a7c;
  --gold:#d8a544; --gold2:#a9701f; --paper:#fbf6e7; --paper2:#f1ead6;
  --line:#d9c9a2; --red:#c4553c; --blue:#3f86b0; --purple:#8e68b4; --green:#3d8f6b;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#173f3c;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:12px;overflow:hidden}
.serif{font-family:"STKaiti","KaiTi","Songti SC","SimSun",serif}
.phone{width:430px;max-width:100%;height:min(932px,calc(100vh - 24px));position:relative;overflow:hidden;
  border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.4);border:1px solid #2b6b61;isolation:isolate}

/* ---------- 背景：青绿水墨 ---------- */
.sky{position:absolute;inset:0;z-index:0;
  background:linear-gradient(180deg,#1e5f59 0%,#2b7d70 7%,#75bfa8 20%,#d9ecce 38%,#f3f2d9 54%,#dceccb 68%,#a9dcc1 82%,#5aae99 100%)}
.sky .mist{position:absolute;left:-10%;right:-10%;height:44%;top:34%;
  background:radial-gradient(ellipse at 30% 40%,rgba(255,250,220,.85),rgba(255,250,220,0) 62%),
             radial-gradient(ellipse at 76% 60%,rgba(255,248,220,.72),rgba(255,248,220,0) 58%);filter:blur(6px)}
.sky svg.mt{position:absolute;left:0;right:0;width:100%;height:100%;opacity:.55}
.sky .cloud{position:absolute;bottom:0;left:0;right:0;height:34%;
  background:radial-gradient(ellipse at 15% 90%,rgba(255,255,255,.55),transparent 60%),
             radial-gradient(ellipse at 82% 78%,rgba(255,255,255,.48),transparent 62%),
             linear-gradient(180deg,transparent,rgba(76,166,143,.5));filter:blur(3px)}
.sky .glow{position:absolute;top:28%;left:50%;width:300px;height:300px;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(255,247,205,.7),transparent 68%)}

/* ---------- 顶部状态 ---------- */
.top{position:absolute;top:0;left:0;right:0;z-index:6;padding:9px 11px 0}
.top .tr{display:flex;align-items:center;gap:7px;height:60px}
.ava{width:58px;height:58px;border-radius:50%;border:2px solid #14574f;background:#cde9d5;flex-shrink:0;
  box-shadow:0 2px 8px rgba(10,50,45,.3),inset 0 0 0 3px rgba(255,255,255,.35);overflow:hidden;position:relative}
.ava svg{width:100%;height:100%;display:block}
.ava .gear{position:absolute;left:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;background:#2d5d55;
  border:2px solid #e9f3da;color:#fff;font-size:10px;text-align:center;line-height:15px}
.who{flex:1;min-width:0;padding-top:2px}
.who .nm{font-size:13px;font-weight:800;color:#eef8e6;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,40,30,.75)}
.who .sub{font-size:10px;color:#cbe6d3;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 3px rgba(0,40,30,.75)}
.who .sub em{font-style:normal;color:#ffdaa2}
.cash{display:flex;align-items:center;gap:5px;margin-left:auto}
.cash .pill{display:flex;align-items:center;gap:3px;height:20px;min-width:52px;border-radius:12px;
  background:linear-gradient(180deg,#1c6f5d,#0f5449);border:1px solid #b7d6a4;padding:0 7px;color:#f4f7df;font-size:11px;font-weight:700}
.cash .pill.blue{background:linear-gradient(180deg,#2f7c9e,#215d80);border-color:#a9cfe2}
.dot-g{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d7f58a,#5aa343);border:1px solid #e7f5c2}
.dot-b{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfeaff,#2f8bc4);border:1px solid #d6f0ff}
.dot-p{width:13px;height:13px;border-radius:3px;transform:rotate(45deg);background:linear-gradient(135deg,#d4a4ea,#8751ad);border:1px solid #edd8f7}
.caps{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:-2px;margin-right:2px;height:20px}
.caps .cap{width:74px;height:20px;border-radius:12px;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:space-around;color:#fff;font-size:11px;letter-spacing:2px}
.caps .cap i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff;display:block;position:relative}
.caps .cap i::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;top:2.5px;left:2.5px}
.hud2{display:flex;align-items:center;gap:7px;margin-top:3px}
.pw{width:124px;height:21px;border-radius:11px;border:1px solid #9d792f;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#e6c063,#b3822e);box-shadow:inset 0 1px 2px rgba(255,255,255,.5)}
.pw b{position:absolute;inset:0;display:flex;align-items:center;gap:3px;padding-left:22px;color:#4a3110;font-size:11px;font-weight:800}
.pw .ico{position:absolute;left:2px;top:1px;width:18px;height:18px;border-radius:50%;background:#f7de91;border:1px solid #8a6020}
.qbtns{margin-left:auto;display:flex;gap:7px}
.qbtn{width:39px;height:39px;border-radius:11px;background:rgba(252,247,229,.9);border:1px solid #b9a977;
  box-shadow:0 2px 5px rgba(20,60,50,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#57503a;font-size:9px;position:relative;cursor:pointer;line-height:1.15}
.qbtn .g{font-size:16px;font-weight:800;color:#3d6c5e}
.qbtn .dot{position:absolute;right:-2px;top:-2px;width:8px;height:8px;border-radius:50%;background:#e2513c;border:1px solid #fff}

/* ---------- 主场景 ---------- */
.stage{position:absolute;left:0;right:0;top:118px;bottom:92px;z-index:3}
.hero{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:170px}
.hero .ring{width:92px;height:92px;margin:0 auto;position:relative;border-radius:50%;
  background:radial-gradient(circle,#e8f7e2,#b8e2c9);border:3px solid #17574e;
  box-shadow:0 0 0 7px rgba(255,255,255,.35),0 0 24px 8px rgba(255,246,190,.55),0 8px 18px rgba(20,70,60,.25);overflow:visible}
.hero .ring svg{width:100%;height:100%;border-radius:50%;display:block}
.hero .ring .leaf{position:absolute;width:20px;height:12px;background:linear-gradient(90deg,#7cc47a,#3d8c62);border-radius:0 90% 0 90%}
.hero .ring .leaf.l{left:-14px;top:46%;transform:rotate(-18deg)}
.hero .ring .leaf.r{right:-14px;top:46%;transform:rotate(160deg)}
.hero .rlm{margin-top:9px;font-size:14px;font-weight:800;color:#2c8e68;text-shadow:0 1px 0 #fff,0 0 8px #eaffea;letter-spacing:1px}
.hero .pw2{font-size:10px;color:#3e7361;margin-top:2px;text-shadow:0 1px 0 #fff}
.float{position:absolute;left:50%;top:6%;font-size:12px;font-weight:800;color:#2e8766;pointer-events:none;
  animation:up 3.2s linear infinite;opacity:0;text-shadow:0 1px 2px #fff}
.float:nth-child(2){animation-delay:1.1s;left:36%}.float:nth-child(3){animation-delay:2.2s;left:64%}
@keyframes up{0%{opacity:0;transform:translateY(14px)}20%{opacity:.9}100%{opacity:0;transform:translateY(-64px)}}
.stage .bird{position:absolute;top:16%;left:18%;color:rgba(40,90,78,.35);font-size:16px;letter-spacing:10px}
.stage .lamp{position:absolute;bottom:12%;left:8%;width:16px;height:34px;background:rgba(50,95,78,.25);border-radius:3px 3px 1px 1px}
.stage .lamp::after{content:"";position:absolute;top:-8px;left:-6px;width:28px;height:9px;background:rgba(50,95,78,.3);border-radius:3px}
.stage .stone{position:absolute;bottom:6%;right:14%;width:64px;height:26px;border-radius:50% 50% 6px 6px;background:rgba(60,105,88,.22)}

/* ---------- 侧边悬浮 ---------- */
.side{position:absolute;z-index:5;display:flex;gap:8px}
.side.l{left:10px;bottom:172px;flex-direction:column}
.side.r{right:10px;bottom:110px;flex-direction:row;align-items:flex-end}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(238,248,231,.86);border:2px solid #3b8b73;
  box-shadow:0 3px 8px rgba(20,70,55,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#2d6c58;cursor:pointer;position:relative}
.cbtn .g{font-size:17px;font-weight:800;line-height:1}
.cbtn .t{font-size:8px;margin-top:2px;white-space:nowrap}
.cbtn .red{position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:#e04b34;border:1px solid #fff}
.cbtn.sq{border-radius:12px;background:rgba(30,80,70,.72);border-color:#8ab8a0;color:#eaf6e8}
.cbtn.sq .g{font-size:14px}.cbtn.sq .t{color:#cfe8d6}
.rlabel{display:flex;gap:6px;position:absolute;bottom:-2px;right:0;font-size:9px;color:#e9f6e9;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.quest{position:absolute;left:10px;bottom:104px;z-index:5;width:176px;height:38px;border-radius:19px;
  background:linear-gradient(180deg,rgba(255,250,232,.94),rgba(238,226,196,.94));border:1px solid #c8ad76;
  display:flex;align-items:center;gap:6px;padding:0 9px;box-shadow:0 2px 6px rgba(20,70,55,.2)}
.quest .qi{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#e8d28a,#b8943f);border:1px solid #8a6a25;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#5c4213;flex-shrink:0}
.quest .qtx{flex:1;min-width:0}
.quest .qt{font-size:10px;color:#5c4a2c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quest .qb{height:4px;border-radius:3px;background:#dfd2ae;margin-top:3px;overflow:hidden}
.quest .qb i{display:block;height:100%;background:linear-gradient(90deg,#e2b34e,#c6693b)}
.quest .qn{font-size:9px;color:#9a6b2c;font-weight:800}

/* ---------- 底部导航 ---------- */
.dock{position:absolute;left:0;right:0;bottom:0;height:90px;z-index:7;display:flex;align-items:flex-end;
  justify-content:space-around;padding:0 6px 8px;
  background:linear-gradient(180deg,rgba(20,88,78,0) 0%,rgba(17,84,76,.55) 28%,#12564e 62%,#0e4a45 100%)}
.dock::before{content:"";position:absolute;top:26px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#7bbf9b,transparent);opacity:.6}
.dock .it{width:60px;text-align:center;color:#e7f4e7;font-size:10px;cursor:pointer;position:relative;padding-bottom:2px}
.dock .it .ic{width:34px;height:34px;margin:0 auto 2px;border-radius:50%;background:linear-gradient(180deg,#eaf5dc,#b9d9bd);
  border:2px solid #7bbf9b;display:flex;align-items:center;justify-content:center;color:#2b6656;font-size:15px;font-weight:800;
  box-shadow:0 2px 5px rgba(0,0,0,.2)}
.dock .it .ic.ribbon{border-radius:6px;background:linear-gradient(180deg,#fbf4dc,#e2d6ac)}
.dock .it.on .ic{box-shadow:0 0 0 2px #f4d483,0 2px 8px rgba(244,212,131,.6)}
.dock .big{width:88px;height:88px;margin-top:-36px;border-radius:50%;position:relative;cursor:pointer;
  background:radial-gradient(circle at 50% 35%,#ffe6a0,#d59a35 70%,#9a681f);border:3px solid #f5d98d;
  box-shadow:0 0 0 4px rgba(20,80,70,.6),0 6px 16px rgba(0,0,0,.35)}
.dock .big .in{position:absolute;inset:6px;border-radius:50%;overflow:hidden;border:2px solid #8a5d1d;background:#e9f2d9}
.dock .big .in svg{width:100%;height:100%}
.dock .big .lb{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:#33424a;color:#fff;border-radius:9px;padding:1px 7px;font-size:9px;border:1px solid #c9d5d8}
.dock .big .lb b{color:#d7a6f0}
.dock .big:active{transform:scale(.95)}

/* ---------- 遮罩 / 弹层 ---------- */
.shade{position:absolute;inset:0;z-index:20;background:rgba(22,36,31,.62);display:none;
  backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px)}
.shade.on{display:block}
.modal{position:absolute;inset:0;z-index:21;display:none;align-items:center;justify-content:center;padding:14px 20px;pointer-events:none}
.modal.on{display:flex}
.modal>*{pointer-events:auto;width:100%;max-height:90%;overflow-y:auto;scrollbar-width:thin}
.mwrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.modal::-webkit-scrollbar,.modal>div::-webkit-scrollbar{width:4px}
.modal>div::-webkit-scrollbar-thumb{background:#c9b98f;border-radius:4px}
.card{background:#fbf6e7;border:2px solid #c9b284;border-radius:12px;box-shadow:0 16px 44px rgba(20,25,15,.4);
  animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.xclose{width:42px;height:42px;margin:14px auto 2px;transform:rotate(45deg);border-radius:9px;
  background:linear-gradient(135deg,#efa45c,#cf4f38);border:2px solid #fff1d8;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.3)}
.xclose b{transform:rotate(-45deg);color:#fff;font-size:24px;font-weight:400;line-height:1}

/* 事件金卡 */
.ev{border:3px solid #e0b15a;background:linear-gradient(180deg,#fff9e9,#fdf3dc);border-radius:10px;
  box-shadow:0 0 0 2px #8b5b23,inset 0 0 0 1px #fff,0 18px 46px rgba(0,0,0,.4);overflow:hidden}
.ev .cap{height:64px;position:relative;background:linear-gradient(180deg,#eda250,#c9752f);
  border-bottom:2px solid #a86524;overflow:hidden}
.ev .cap .sun{position:absolute;left:50%;top:8px;width:70px;height:70px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle,#ffedbb,#f5c67b);opacity:.55}
.ev .cap svg{position:absolute;bottom:0;left:0;width:100%;height:36px}
.ev .cap .ttl{position:absolute;left:50%;top:7px;transform:translateX(-50%);min-width:76px;height:34px;
  border-radius:18px;background:linear-gradient(180deg,#fff0c4,#eec982);border:2px solid #9c6120;
  color:#7a4313;font-size:17px;font-weight:800;letter-spacing:3px;text-align:center;line-height:30px;
  box-shadow:0 2px 5px rgba(90,50,10,.3);z-index:2;padding:0 10px}
.ev .eye{position:absolute;right:9px;top:7px;width:28px;height:28px;border-radius:50%;background:#fff8ea;
  border:2px solid #d0a25c;display:flex;align-items:center;justify-content:center;font-size:15px;color:#7a5a2c;cursor:pointer;z-index:3}
.ev .pair{display:flex;justify-content:center;gap:26px;padding:14px 0 6px}
.ev .pair .one{text-align:center;width:78px}
.ev .pair .one .ph{width:54px;height:54px;margin:0 auto;border-radius:50%;overflow:hidden;border:2px solid #c9ac6e;background:#e7f2e0}
.ev .pair .one .ph svg{width:100%;height:100%}
.ev .pair .one .n{font-size:12px;color:#4b3b28;margin-top:4px;font-weight:700;white-space:nowrap}
.ev .pair .one .r{font-size:10px;color:#8b6b42}
.ev .body{padding:8px 18px 12px;font-size:14px;line-height:1.95;color:#5b4028;font-family:"STKaiti","KaiTi","Songti SC",serif}
.ev .opt{display:block;width:calc(100% - 36px);margin:9px 18px;height:44px;border-radius:22px;cursor:pointer;
  background:linear-gradient(180deg,#fffdf6,#f5ebd5);border:1px solid #d8c095;color:#4d3c25;font-size:14px;
  font-family:"STKaiti","KaiTi","Songti SC",serif;letter-spacing:1px;box-shadow:0 2px 3px rgba(140,100,50,.15)}
.ev .opt:active{background:#f3e2bf;border-color:#b98a45}
.ev .opt small{display:block;font-size:9px;color:#a08456;letter-spacing:0}
.ev .foot{text-align:center;font-size:10px;color:#9a7c4d;padding:2px 0 12px}

/* 青绿面板 */
.dp{background:linear-gradient(180deg,#f8f6e8,#f2eeda);border:2px solid #c3b287;border-radius:10px;overflow:hidden;
  box-shadow:0 16px 40px rgba(20,30,20,.4)}
.dp .ttl{height:38px;background:linear-gradient(180deg,#59a991,#2c7d6b);color:#fff9e7;text-align:center;
  line-height:38px;font-size:17px;letter-spacing:3px;font-family:"STKaiti","KaiTi","Songti SC",serif;font-weight:700;
  border-bottom:2px solid #1e6558;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.dp .inner{padding:10px 11px 12px}
.secbar{height:26px;margin:4px 0 8px;position:relative;background:linear-gradient(180deg,#63ad98,#3b8a77);
  border-radius:4px;color:#fffdf0;text-align:center;line-height:26px;font-size:13px;letter-spacing:2px;
  font-family:"STKaiti","KaiTi",serif;box-shadow:inset 0 1px 2px rgba(255,255,255,.25)}
.secbar::before,.secbar::after{content:"~";position:absolute;top:0;color:#dff0e3;font-size:15px;opacity:.8}
.secbar::before{left:8px}.secbar::after{right:8px}
.secbar .qm{position:absolute;right:8px;top:1px;width:19px;height:19px;border-radius:50%;border:1px solid #fff;
  font-size:11px;line-height:18px;background:rgba(255,255,255,.18)}
.secbar .qm+::after{display:none}
.mini{font-size:10px;color:#826f52;line-height:1.6}
.hr{height:1px;background:#ded2b6;margin:10px 0}

/* 存档 / 网吧换机续玩 */
.sectttl{font-size:12px;font-weight:800;letter-spacing:3px;color:#1d6458;text-align:center;margin:2px 0 7px}
.warnbar{background:#fff0d8;border:1px dashed #c99a52;border-radius:8px;padding:8px 9px;font-size:10px;
  color:#7a4a17;line-height:1.65;margin-bottom:8px}
.warnbar b{color:#a04b18}
.savecode{display:block;width:100%;height:62px;box-sizing:border-box;border:1px solid #cbb88b;border-radius:7px;
  background:#fffdf5;color:#4b3a20;font-size:10px;line-height:1.4;padding:6px 8px;resize:vertical;
  font-family:Consolas,"Courier New",monospace;word-break:break-all}
.filebtn{display:block!important;text-align:center;position:relative;overflow:hidden;cursor:pointer;padding:8px 4px!important}
.filebtn .fileinput{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

/* 弟子属性 */
.dtop{display:flex;gap:9px;align-items:center;margin-bottom:8px}
.dtop .ph{width:64px;height:64px;border-radius:50%;border:3px solid #1d6458;background:#dff0df;overflow:hidden;flex-shrink:0;
  box-shadow:0 0 0 4px rgba(255,255,255,.6)}
.dtop .ph svg{width:100%;height:100%}
.dtop .l{flex:1;min-width:0}
.dtop .pwb{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(180deg,#e9c667,#bb8a2f);
  border:1px solid #8a6220;border-radius:10px;padding:1px 9px;color:#4a3110;font-size:14px;font-weight:800}
.dtop .rate{font-size:10px;color:#2f7c9a;margin-top:4px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.cell{background:#fffdf3;border:1px solid #e6dcc0;border-radius:6px;padding:5px 2px;text-align:center}
.cell .k{font-size:10px;color:#8a7a60}
.cell .v{font-size:13px;font-weight:800;color:#2e6e57;line-height:1.4}
.cell .v.b{color:#3f7ba0}.cell .v.r{color:#b3543c}
.qiline{display:flex;align-items:center;gap:6px;font-size:10px;color:#6c5c42;margin:5px 0}
.qiline .bar{flex:1;height:9px;border-radius:5px;background:#e3d7b8;overflow:hidden;position:relative}
.qiline .bar i{display:block;height:100%;background:linear-gradient(90deg,#e8ad43,#d06a37)}
.qiline .bar span{position:absolute;inset:0;text-align:center;font-size:8px;color:#4b3a20;line-height:9px}
.qiline .plus{color:#2e7f62;font-weight:800;white-space:nowrap}
.radar{position:relative;height:158px;display:flex;align-items:center;justify-content:center}
.radar svg{width:190px;height:158px}
.radar .lbs{position:absolute;inset:0;pointer-events:none}
.radar .lb{position:absolute;font-size:10px;color:#9a6a2c;white-space:nowrap}
.radar .lb b{color:#2e7f62}
.tags{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.tagchip{border-radius:4px;padding:3px 8px;font-size:11px;color:#fff;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tagchip.gray{background:#7d817c}
.eq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

function startSecret(S, out, id) {
  S.stat.secretRuns = (S.stat.secretRuns || 0) + 1;
  var sc = T.SECRET_BY_ID[id || 's1'];
  // 一世最多进 8 次秘境，防止「再来」这类回环把抉择刷成死循环
  if (!sc || S.stat.secretRuns > 8) {
    S.scroll += 2;
    log(S, '那道门今天不开了，藏经阁倒多了两卷残卷。', 'plain', '秘境');
    if (out) out.secret = false;
    return;
  }
  raise(S, sc, out, 'secret');
  if (out) out.secret = true;
}

function choose(S, idx, out) {
  if (!S.pending) return { ok: false, msg: '眼下没有要拿主意的事。' };
  var p = S.pending, raw = p._raw[idx] || p._raw[0];
  var key = p.id + '#' + idx;
  S.stat.choices[key] = (S.stat.choices[key] || 0) + 1;
  if (API.globalChoices) API.globalChoices[key] = (API.globalChoices[key] || 0) + 1;
  var e = JSON.parse(JSON.stringify(raw.e || {}));
  // 有风险标记的选项，可能翻车
  if (raw.risk && rnd(S) < raw.risk) {
    e = { stone: -40, fame: -6 };
    log(S, '这事没办利索。', 'bad', '抉择');
  }
  if (raw.next) e.next = raw.next;
  if (raw.egg) e.egg = raw.egg;
  if (raw.flag) e.flag = raw.flag;
  if (raw.war) e.war = raw.war;
  S.pending = null;
  log(S, '你选了：' + raw.n + (resStr(e) ? '　（' + resStr(e) + '）' : ''), 'choice', '抉择');
  applyEff(S, e, out);
  if (out) out.chosen = raw.n;
  return { ok: true };
}

/* ================= 年度结算 ================= */
function yearEnd(S, out) {
  var i, d;
  var pa = pathOf(S).per, ma = masterOf(S).per, pp = partnerOf(S).per;

  /* 建筑产出 */
  var inc = { stone: 0, herb: 0, ore: 0, fame: 0, scroll: 0 };
  D.BUILDINGS.forEach(function (b) {
    var lv = S.buildings[b.k] || 0;
    if (!lv || !b.out) return;
    for (var k in b.out) {
      var v = b.out[k] * lv;
      if (k === 'herb' && ma.herb) v *= ma.herb;
      if (k === 'fame') v *= (pa.fame || 1);
      inc[k] = (inc[k] || 0) + v;
    }
  });
  inc.stone += 24 + liveDisciples(S).length * 4;   // 弟子下山做点零活
  inc.stone += pp.stone || 0;
  inc.scroll += ma.scroll || 0;
  // 商道加成
  if (pa.trade) inc.stone = Math.round(inc.stone * pa.trade);
  // 会算账 / 道侣
  var suan = liveDisciples(S).some(function (x) { return x.talent === 'suan'; });
  var outgo = Math.round((liveDisciples(S).length * 3 + Object.keys(S.buildings).reduce(function (a, k) { return a + S.buildings[k]; }, 0) * 2) * (suan ? 0.8 : 1));
  inc.stone -= outgo;

  for (var k in inc) {
    if (k === 'scroll') S.scroll = Math.round((S.scroll + inc[k]) * 10) / 10;
    else S[k] = Math.max(0, Math.round(S[k] + inc[k]));
  }
  S.scroll = Math.floor(S.scroll * 10) / 10;
  if (inc.stone < 0) log(S, '今年入不敷出，账房把算盘拨得劈啪响。', 'bad', '账目');

  /* 弟子修炼 */
  var ds = liveDisciples(S);
  for (i = 0; i < ds.length; i++) {
    d = ds[i];
    d.age++;
    if (d.status === 'hurt' && rnd(S) < (0.45 + (pp.heal || 0) * 0.08)) d.status = 'ok';
    d.qi += growOf(S, d);
    if (d.talent === 'yun' && rnd(S) < 0.3) S.stone += ri(S, 15, 45);
    if (d.talent === 'tou' && rnd(S) < 0.12) {
      if (rnd(S) < 0.4) { S.stone += ri(S, 30, 90); S.scroll += 1; log(S, d.name + ' 从外头顺了点东西回来，你决定不深究。', 'egg', '弟子'); }
      else S.stone = Math.max(0, S.stone - ri(S, 10, 35));
    }
    if (d.talent === 'zui' && rnd(S) < 0.06) { d.grow = (d.grow || 0) + 0.25; log(S, d.name + ' 喝多了，第二天忽然想通一门功法。', 'good', '弟子'); }
    if (d.talent === 'cang' && d.age === 30 && qualOf(d.q).star <= 2) {
      d.q = 'jue'; log(S, d.name + ' 藏了三十年，今天露了一手，全宗门都愣了。', 'good', '弟子');
    }
    tryBreak(S, d, out);

    // 寿命
    var life = D.REALMS[d.realm].life + d.lifeBonus + (pp.life || 0);
    if (d.age > life && rnd(S) < 0.28) {
      d.status = 'dead';
      log(S, d.name + ' 坐化了，' + D.REALMS[d.realm].n + '，享年 ' + d.age + '。', 'plain', '弟子');
    }
    // 忠诚 / 叛门
    var loy = d.loyalty + (pa.loyalty || 0);
    if (d.talent === 'ni' && d.realm >= 5) loy -= 8;
    if (d.trait === 'hua' && rnd(S) < 0.05) loy -= 12;
    if (loy < 18 && rnd(S) < 0.12) {
      d.status = 'gone';
      log(S, d.name + ' 卷了铺盖下山了，桌上留了张条。', 'bad', '弟子');
      S.flags.pan = true;
      achAdd(S, 'luan');
    }
    d.loyalty = Math.max(0, Math.min(100, loy));
  }

  /* 宗门等级 */
  var newLv = levelOf(S);
  if (newLv > (S._lv || 0)) {
    log(S, '声望够了，外头开始管这儿叫【' + D.LEVELS[newLv].n + '】。', 'good', '升格');
    if (newLv >= 3) achAdd(S, 'lv3');
    if (newLv >= 6) achAdd(S, 'lv6');
    if (out) out.levelUp = D.LEVELS[newLv].n;
  }
  S._lv = newLv;

  /* 成就检查 */
  if (S.stone >= 5000) achAdd(S, 'fu');
  if (S.fame > S.stat.maxFame) S.stat.maxFame = S.fame;
  if (S.stone > S.stat.maxStone) S.stat.maxStone = S.stone;
  var builtAll = D.BUILDINGS.every(function (b) { return S.buildings[b.k] > 0; });
  if (builtAll) achAdd(S, 'allbuild');
  var roots = {}; liveDisciples(S).forEach(function (x) { roots[x.root] = 1; });
  if (['jin', 'mu', 'shui', 'huo', 'tu'].every(function (r) { return roots[r]; })) {
    achAdd(S, 'wuxing'); eggAdd(S, 'wuxing');
  }
  if (Object.keys(S.stat.tasks).length >= 6) achAdd(S, 'pai');

  /* 闲笔 */
  if (rnd(S) < 0.55) log(S, pick(S, T.FLAVOR), 'plain', '');

  /* 彩蛋：关山门 / 自记年号 */
  if (S.closedYears >= 3) eggAdd(S, 'guanmen');
  if (S.year >= 60 && !S.flags.nianhao) { S.flags.nianhao = true; eggAdd(S, 'nianhao'); }

  /* 人丁：声望起来了，会有人自己找上门 */
  if (rnd(S) < 0.14 + levelOf(S) * 0.035 && liveDisciples(S).length < capOf(S)) {
    var nd = recruitOne(S, out, true);
    if (nd) log(S, nd.name + ' 自己找上山门来了，说听人提过这儿。', 'plain', '投奔');
  }

  /* 剧情事件 */
  if (!S.pending && rnd(S) < 0.34) {
    var ev = findEvent(S);
    if (ev) raise(S, ev, out);
  }
  /* 外敌：每 5 年一次，等级越高越容易来 */
  if (!S.pending && S.year % 5 === 0 && S.year >= 5) {
    if (rnd(S) < 0.62) startWar(S, out);
  }

  /* 结局检查 */
  if (out.feisheng) return endGame(S, 'feisheng', out);
  if (S.flags.mie || (liveDisciples(S).length === 0 && S.year > 45 && S.stone < 80)) return endGame(S, 'fumi', out);
  if (S.year >= 120) return endGame(S, null, out);
}

function endGame(S, force, out) {
  var k = force;
  if (!k) {
    var lv = levelOf(S), ds = liveDisciples(S);
    var topRealm = ds.reduce(function (a, d) { return Math.max(a, d.realm); }, 0);
    var acts = S.stat.acts || {}, tasks = S.stat.tasks || {};
    if ((topRealm >= 9 && S.stat.maxFame >= 5000) || (S.stat.maxFame >= 10000 && S.stat.wins >= 10)) k = 'feisheng';
    else if ((lv >= 5 && S.stat.wins >= 7) || (S.stat.wins >= 10 && lv >= 4)) k = 'yitong';
    else if (S.path === 'mo' && (lv >= 3 || S.stat.wins >= 6 || (tasks.ti || 0) >= 3)) k = 'chengmo';
    else if (S.stat.maxStone >= 2600 || (S.path === 'shang' && S.stone >= 900)) k = 'fujia';
    else if ((acts.close || 0) >= 3 || S.closedYears >= 3 || (S.stat.wins + S.stat.loses) <= 1) k = 'yinshi';
    else if (lv <= 1 && S.stat.loses > S.stat.wins + 2) k = 'fumi';
    else k = 'pingdan';
  }
  var def = null;
  for (var i = 0; i < T.ENDINGS.length; i++) if (T.ENDINGS[i].k === k) def = T.ENDINGS[i];
  if (!def) def = T.ENDINGS[6];
  var ds2 = liveDisciples(S).slice().sort(function (a, b) { return b.qi - a.qi; });
  var top = ds2.length ? ds2[0].name : '没人';
  var ep = def.ep.split('{name}').join(S.name).split('{top}').join(top);
  var p = (D.POP.ending[def.k] || 0.15) * (D.POP.path[S.path] || 0.25) * 5.2;
  p *= Math.pow(0.9, Math.min(10, S.eggs.length));
  p *= Math.pow(0.94, Math.min(10, Object.keys(S.flags).length));
  p *= Math.pow(0.95, Math.min(8, S.stat.wins));
  var flavor = 0.55 + (hash(JSON.stringify(S.stat.choices) + S.stat.recruits + S.gen + S.eggs.length + S.year) % 1000) / 1100;
  p *= flavor;
  var matchPct = fmtPct(Math.max(0.0001, Math.min(0.94, p)));
  var comboId = (hash([S.path, S.master, S.partner, JSON.stringify(S.buildings), JSON.stringify(S.stat.choices),
    JSON.stringify(S.stat.acts), S.stat.recruits, S.stat.wins, S.eggs.length, S.gen, S.year, def.k].join('|')) % 90000) + 10000;
  // 选择口味：这一世更爱第几档
  var cc = [0, 0, 0];
  for (var ck3 in S.stat.choices) {
    var oi3 = parseInt(ck3.split('#')[1], 10);
    if (oi3 >= 0 && oi3 < 3) cc[oi3] += S.stat.choices[ck3];
  }
  var mx = 0;
  for (var z3 = 1; z3 < 3; z3++) if (cc[z3] > cc[mx]) mx = z3;
  var style = ['求稳派', '折中派', '整活派'][mx] + '（稳 ' + cc[0] + ' / 中 ' + cc[1] + ' / 野 ' + cc[2] + ' 次）';
  // 全服最冷门的那一档，你碰过没有
  var rarest = '没碰上';
  var best = 101, rareName = '', rareHits = 0;
  var allEv = T.EVENTS.concat(T.SECRETS);
  for (var ck in S.stat.choices) {
    var seg = ck.split('#'), eid = seg[0], oi = parseInt(seg[1], 10);
    for (var ei = 0; ei < allEv.length; ei++) {
      var ev = allEv[ei];
      if (ev.id !== eid || !ev.opts[oi]) continue;
      var pv = Math.round((D.POP.opts[oi] !== undefined ? D.POP.opts[oi] : (1 / ev.opts.length)) * 100);
      if (pv < best) { best = pv; rareName = ev.opts[oi].n; rareHits = S.stat.choices[ck]; }
    }
  }
  if (rareName) rarest = rareName + '（这一档全服 ' + best + '% 会这么选，你点了 ' + rareHits + ' 次）';
  var route = [pathOf(S).tag, masterOf(S).n.split(' · ')[0], (S.stat.wins >= S.stat.loses ? '能打' : '能忍'),
    (S.eggs.length >= 5 ? '好事之徒' : '老实人')].join(' · ');
  S.result = {
    k: def.k, n: def.n, c: def.c, d: def.d, ep: ep,
    years: S.year, gen: S.gen, level: D.LEVELS[levelOf(S)].n,
    fame: S.fame, stone: S.stone, disciples: S.disciples.length,
    alive: liveDisciples(S).length, wins: S.stat.wins, loses: S.stat.loses,
    eggs: S.eggs.length, ach: S.ach.length,
    matchPct: matchPct, comboId: comboId, route: route, rarest: rarest, style: style,
    top: top, topRealm: ds2.length ? D.REALMS[ds2[0].realm].n : '-',
    roster: ds2.slice(0, 6).map(function (d) {
      return { n: d.name, q: qualOf(d.q).n, root: rootOf(d.root).n, realm: D.REALMS[d.realm].n, power: powerOf(S, d) };
    }),
    eggsList: S.eggs.map(function (e) { return T.EGGS[e] ? T.EGGS[e][0] : e; })
  };
  S.over = true;
  log(S, '—— 这一世到此为止 ——', 'good', '结局');
  if (out) out.end = def.n;
  return S.result;
}

/* ================= 动作 ================= */
function buildCost(S, k) {
  var b = D.BUILD_BY_K[k], lv = S.buildings[k] || 0;
  var mul = Math.pow(1.65, lv);
  return { stone: Math.round(b.cost.stone * mul), ore: Math.round(b.cost.ore * mul) };
}
API.buildCost = buildCost;

API.act = function (S, type, p) {
  p = p || {};
  var out = { ok: true, msg: '', newbies: [], breaks: [], res: '' };
  if (S.over && ['restart', 'transfer', 'none'].indexOf(type) < 0) return { ok: false, msg: '这一世已经收尾了。' };

  switch (type) {
    /* ---- 开局 ---- */
    case 'setup': {
      if (S.created) return { ok: false, msg: '宗门已经开张了。' };
      var path = null;
      D.PATHS.forEach(function (x) { if (x.k === p.path) path = x; });
      if (!path) return { ok: false, msg: '先挑一条路。' };
      S.path = p.path;
      S.master = p.master || 'jian';
      S.partner = p.partner || 'none';
      S.name = (p.name || '破山门').toString().slice(0, 8);
      S.stone = path.start.stone; S.herb = path.start.herb;
      S.ore = path.start.ore; S.scroll = path.start.scroll; S.fame = path.start.fame;
      S.created = true;
      // 传位继承
      if (S.legacy.scroll) { S.scroll += S.legacy.scroll; log(S, '历代掌门留下 ' + S.legacy.scroll + ' 卷残卷，一并接了过来。', 'good', '传承'); }
      (S.legacy.blueprints || []).forEach(function (b) { S.buildings[b] = Math.max(S.buildings[b] || 0, 1); });
      if (S.legacy.blueprints.length) log(S, '照着旧图纸，几间屋子直接立了起来。', 'good', '传承');
      // 开山长老自带一间对应建筑
      var mj = masterOf(S).job;
      if (mj && D.BUILD_BY_K[mj]) S.buildings[mj] = Math.max(S.buildings[mj] || 0, 1);
      log(S, S.name + ' 开山。路数：' + path.n + '，开山长老 ' + masterOf(S).n + '，' +
        (S.partner === 'none' ? '掌门暂不设道侣' : '道侣 ' + partnerOf(S).n) + '。', 'good', '开宗');
      log(S, '山门就一间破殿、两间柴房。' + path.d, 'plain', '开局');
      // 开局送两个弟子
      recruitOne(S, out, true); recruitOne(S, out, true);
      out.msg = '开张了。';
      break;
    }

    /* ---- 推进一年 ---- */
    case 'year': {
      if (!S.created) return { ok: false, msg: '先把宗门建起来。' };
      if (S.pending) return { ok: false, msg: '先把眼前这件事拿个主意。' };
      S.year++;
      log(S, '—— 第 ' + S.year + ' 年 ——', 'year', '纪年');
      var r = yearEnd(S, out);
      S.ap = apMaxOf(S); S.apMax = S.ap;
      if (S.closedYears > 0) S.closedYears--;
      out.msg = r ? '这一世收尾了。' : '过了一年。';
      out.result = r || null;
      break;
    }

    /* ---- 招募 ---- */
    case 'recruit': {
      if (S.pending) return { ok: false, msg: '先了结眼前的事。' };
      var free = false;
      if (S.items.ling > 0) { S.items.ling--; free = true; }
      else if (p.ad) { free = true; }
      else {
        if (S.ap <= 0) return { ok: false, msg: '今年的事做完了，点「过一年」。' };
        var cost = Math.round(80 * (partnerOf(S).per.recruit || 1));
        if (S.stone < cost) return { ok: false, msg: '灵石不够，招一次要 ' + cost + '。' };
        S.stone -= cost; S.ap--;
      }
      if (liveDisciples(S).length >= capOf(S)) return { ok: false, msg: '弟子寮住满了，先盖寮。' };
      var nd = recruitOne(S, out, free);
      if (nd && rnd(S) < 0.22) log(S, pick(S, ['来了三个人，只留下他一个。', '他说走了很远的路才找着这儿。', '问他为啥来，他说顺路。']), 'plain', '招募');
      S.stat.acts.recruit = (S.stat.acts.recruit || 0) + 1;
      out.msg = nd ? '招到 ' + nd.name + '。' : '没招着。';
      break;
    }

    /* ---- 建筑 ---- */
    case 'build': {
      if (S.pending) return { ok: false, msg: '先了结眼前的事。' };
      var b = D.BUILD_BY_K[p.k];
      if (!b) return { ok: false, msg: '没这间屋子。' };
      var lv = S.buildings[p.k] || 0;
      if (lv >= b.max) return { ok: false, msg: b.n + ' 已经盖到顶了。' };
      if (p.k !== 'dorm' && lv >= D.LEVELS[levelOf(S)].cap) return { ok: false, msg: '宗门等级不够，得先涨声望。' };
      if (S.ap <= 0) return { ok: false, msg: '今年的事做完了，点「过一年」。' };
      var c = buildCost(S, p.k);
      if (S.stone < c.stone || S.ore < c.ore) return { ok: false, msg: '要 ' + c.stone + ' 灵石、' + c.ore + ' 矿石，不够。' };
      S.stone -= c.stone; S.ore -= c.ore; S.ap--;
      S.buildings[p.k] = lv + 1;
      S.apMax = apMaxOf(S);
      log(S, (lv ? '把' : '盖起了') + b.n + (lv ? '升到 ' + (lv + 1) + ' 级' : '') + '。' + b.d, 'good', '营造');
      S.stat.acts.build = (S.stat.acts.build || 0) + 1;
      out.msg = b.n + (lv ? ' 升级' : ' 落成');
      break;
    }

    /* ---- 派任务 ---- */
    case 'task': {
      if (S.pending) return { ok: false, msg: '先了结眼前的事。' };
      var tk = null;
      D.TASKS.forEach(function (x) { if (x.k === p.k) tk = x; });
      if (!tk) return { ok: false, msg: '没这趟差事。' };
      if (S.ap <= 0) return { ok: false, msg: '今年的事做完了，点「过一年」。' };
      var pool = liveDisciples(S).filter(function (d) { return d.status !== 'hurt'; });
      if (!pool.length) return { ok: false, msg: '没能使唤的人了。' };
      var uids = p.uids && p.uids.length ? p.uids : null;
      var team = uids ? pool.filter(function (d) { return uids.indexOf(String(d.uid)) >= 0 || uids.indexOf(d.uid) >= 0; }) : null;
      if (!team || !team.length) {
        // 自动挑最合适的三个
        team = pool.slice().sort(function (a, b) {
          var fa = taskFit(S, a, tk), fb = taskFit(S, b, tk);
          return fb - fa;
        }).slice(0, 3);
      }
      S.ap--;
      S.stat.tasks[tk.k] = (S.stat.tasks[tk.k] || 0) + 1;
      S.stat.acts[tk.k] = (S.stat.acts[tk.k] || 0) + 1;
      if (Object.keys(S.stat.tasks).length >= 6) achAdd(S, 'pai');
      var names = team.map(function (d) { return d.name; }).join('、');
      var fit = team.reduce(function (a, d) { return a + taskFit(S, d, tk); }, 0) / team.length;
      var gain = {};
      for (var gk in tk.gain) {
        var gv = tk.gain[gk] * (0.7 + fit * 0.5) * (0.7 + team.length * 0.13);
        if (gk === 'qi') { team.forEach(function (d) { d.qi += Math.round(gv * growOf(S, d) * 1.5); }); continue; }
        if (gk === 'grow') { team.forEach(function (d) { d.grow = (d.grow || 0) + gv * 0.1; }); continue; }
        gain[gk] = Math.round(gv);
      }
      var bad = false;
      if (tk.diff > 0 && rnd(S) < Math.max(0.04, 0.26 - fit * 0.14) * tk.diff) {
        bad = true;
        gain = {};
        if (rnd(S) < 0.7) hurtOne(S, out);
        log(S, names + ' 去' + tk.n + '，出了点岔子。', 'bad', '差事');
      } else {
        applyEff(S, gain, out);
        team.forEach(function (d) { d.qi += Math.round(8 + tk.diff * 12); });
        log(S, names + ' 去' + tk.n + '，回来了。' + resStr(gain), 'good', '差事');
        if (tk.k === 'mi' && rnd(S) < 0.32 && !S.pending) startSecret(S, out);
        if (tk.k === 'bi') team.forEach(function (d) { d.status = 'closed'; });
        else team.forEach(function (d) { if (d.status === 'closed') d.status = 'ok'; });
      }
      out.msg = bad ? '出了岔子。' : (tk.n + '：' + resStr(gain));
      break;
    }

    /* ---- 炼丹 / 炼器 ---- */
    case 'craft': {

function taskFit(S, d, tk) {

/* ---------------- 工具 ---------------- */
function rnd(G) {
  G.rs = (Math.imul(G.rs, 1664525) + 1013904223) >>> 0;
  return G.rs / 4294967296;
}
function ri(G, a, b) { return a + Math.floor(rnd(G) * (b - a + 1)); }
function pick(G, arr) { return arr[Math.floor(rnd(G) * arr.length)]; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function P(t, c) { return { t: String(t == null ? '' : t), c: c || '' }; }
function fmt(n) {
  n = Number(n) || 0;
  var a = Math.abs(n);
  if (a >= 1e12) return (n / 1e12).toFixed(2) + '万亿';
  if (a >= 1e8) return (n / 1e8).toFixed(2) + '亿';
  if (a >= 1e4) return (n / 1e4).toFixed(2) + '万';
  return String(Math.round(n));
}
I.fmt = fmt;

function dateOf(day) {
  var d = Math.max(1, day | 0);
  var y = Math.floor((d - 1) / 360) + 1;
  var m = Math.floor((d - 1) % 360 / 30) + 1;
  var dd = (d - 1) % 30 + 1;
  return { y: y, m: m, d: dd, str: '仙历 ' + y + '年' + (m < 10 ? '0' : '') + m + '月' + (dd < 10 ? '0' : '') + dd + '日' };
}
I.dateOf = dateOf;

function nameOf(G) {
  return pick(G, D.SURNAMES) + pick(G, D.GIVEN1);
}
function qualityOf(G) {
  var tot = 0, i;
  for (i = 0; i < D.QUALITY.length; i++) tot += D.QUALITY[i].w;
  var r = rnd(G) * tot;
  for (i = 0; i < D.QUALITY.length; i++) { r -= D.QUALITY[i].w; if (r <= 0) return D.QUALITY[i]; }
  return D.QUALITY[0];
}
function titleOf(G) {
  return pick(G, ['剑修', '丹修', '阵修', '符修', '体修', '气修', '御兽修']);
}

/* ---------------- 状态 ---------------- */
I.create = function (seed) {
  seed = (seed == null ? Date.now() : seed) >>> 0;
  var G = {
    v: I.VER, rs: seed || 1, seed: seed, created: false,
    name: '破山门', path: 'zheng', master: 'jian', partner: 'none', gen: 1,
    day: 1, qi: 0, realm: 0, breakBonus: 0, power: 0, peakPower: 0,
    jade: 3, stone: 152300, purple: 0, herb: 20, ore: 12, scroll: 2, fame: 0,
    energy: 52, keys: 1, energyTick: 0,
    disciples: [], uid: 1, lead: 0, focus: 0, cap: 20,
    buildings: {}, formation: [], dao: [], pets: [], items: {},
    flags: {}, eggs: [], ach: {}, recent: [],
    journal: [], pending: null, result: null, offline: null,
    sign: { key: '', streak: 0, total: 0, got: [] },
    questIdx: 0, questGot: [], stat: { travels: 0, breaks: 0, recruits: 0, wins: 0, loses: 0, chooses: [0, 0, 0] },
    ad: { key: '', used: 0 }, auto: false, speed: 1, savedAt: 0, comboId: 0
  };
  return G;
};

function makeDisciple(G, opt) {
  opt = opt || {};
  var q = opt.q || qualityOf(G);
  var root = opt.root || pick(G, D.ROOTS);
  var trait = opt.trait || pick(G, D.TRAITS);
  var talent = (!opt.noTalent && rnd(G) < 0.34) ? pick(G, D.TALENTS) : null;
  var d = {
    uid: G.uid++, name: nameOf(G), title: titleOf(G),
    root: root.n, rootK: root.k, rootC: root.c,
    qn: q.n, qc: q.c, qk: q.k, qmul: q.mul, star: q.star,
    trait: trait.n, traitGrow: trait.grow, traitRisk: trait.risk,
    talent: talent ? talent.n : '', talentD: talent ? talent.d : '',
    age: ri(G, 15, 28), life: 65 + Math.floor(q.mul * 30),
    qi: 0, realm: 0, power: 0, loyalty: 70,
    gen: { gg: 0, fy: 0, wx: 0, zz: 0, ss: 0, tp: 0 },
    equip: {}, dao: [], pet: '', journal: [], status: 'ok'
  };
  var base = Math.round(18 + q.mul * 22);
  d.gen = {
    gg: clamp(base + ri(G, -8, 18), 8, 99),
    fy: clamp(base + ri(G, -8, 18), 8, 99),
    wx: clamp(base + ri(G, -8, 18), 8, 99),
    zz: clamp(base + ri(G, -5, 70), 8, 160),
    ss: clamp(base + ri(G, -8, 18), 8, 99),
    tp: clamp(base + ri(G, -8, 18), 8, 99)
  };
  // 开局白送一把兵刃
  d.equip.sword = { lv: 1, q: 1, n: '青锋' };
  d.power = Math.round(90 + q.mul * 140 + d.gen.zz * 1.2);
  d.journal.unshift({ date: dateOf(G.day).str, parts: [P(d.name, 'name'), P('背着包袱上了山，站在院里等了半天，才有人想起来给他安排住处。')] });
  return d;
}

function pathOf(G) { for (var i = 0; i < D.PATHS.length; i++) if (D.PATHS[i].k === G.path) return D.PATHS[i]; return D.PATHS[0]; }
function masterOf(G) { for (var i = 0; i < D.MASTERS.length; i++) if (D.MASTERS[i].k === G.master) return D.MASTERS[i]; return D.MASTERS[0]; }
function partnerOf(G) { for (var i = 0; i < D.PARTNERS.length; i++) if (D.PARTNERS[i].k === G.partner) return D.PARTNERS[i]; return D.PARTNERS[4]; }
function leadOf(G) {
  for (var i = 0; i < G.disciples.length; i++) if (G.disciples[i].uid === G.lead) return G.disciples[i];
  return G.disciples[0] || null;
}
function focusOf(G) {
  for (var i = 0; i < G.disciples.length; i++) if (G.disciples[i].uid === G.focus) return G.disciples[i];
  return leadOf(G);
}
function alive(G) { return G.disciples.filter(function (d) { return d.status === 'ok'; }); }
function hasDao(G, k) { return G.dao.indexOf(k) >= 0; }
function hasPet(G, k) { return G.pets.indexOf(k) >= 0; }

function qiMaxOf(G) {
  var cur = D.REALMS[clamp(G.realm, 0, D.REALMS.length - 1)];
  var nx = D.REALMS[clamp(G.realm + 1, 0, D.REALMS.length - 1)];
  return Math.max(1200, (nx.need - cur.need) * 10);
}
I.qiMaxOf = qiMaxOf;

function qiRateOf(G) {
  var arr = G.buildings.array || 0, d = leadOf(G);
  var r = 8 + G.realm * 3 + arr * 4 + (d ? d.qmul * 3 + d.traitGrow * 2 : 0);
  if (hasDao(G, 'ming')) r += 8;
  if (hasPet(G, 'mao')) r += 4;
  var per = pathOf(G).per.grow || 1;
  var mp = masterOf(G).per.grow || 1;
  return Math.max(1, Math.round(r * per * mp));
}
function stoneRateOf(G) {
  var r = 6 + (G.buildings.mine || 0) * 3 + (G.buildings.altar || 0) * 1;
  if (hasDao(G, 'hou')) r += 6;
  return Math.max(1, Math.round(r * (pathOf(G).per.stone || 1)));
}
function equipPower(d) {
  var p = 0;
  EQUIP_SLOTS.forEach(function (s) {
    var e = d.equip[s.k];
    if (e) p += Math.round((70 + e.lv * 130) * (e.q || 1));
  });
  return p;
}
function calcPower(G) {
  var d = leadOf(G);
  var base = 800 + Math.pow(G.realm + 1, 1.8) * 900 + G.qi * 2.2 + G.breakBonus;
  var eq = d ? equipPower(d) : 0;
  var men = alive(G).reduce(function (a, x) { return a + x.power * 0.15; }, 0);
  var bld = (G.buildings.arena || 0) * 260 + (G.buildings.ward || 0) * 90;
  var mul = 1 + (G.buildings.arena || 0) * 0.08 + G.formation.length * 0.06 + G.dao.length * 0.06
    + G.pets.length * 0.06 + (G.powerBuff || 0) * 0.05
    + (masterOf(G).per.power ? masterOf(G).per.power - 1 : 0)
    + (partnerOf(G).per.power ? partnerOf(G).per.power - 1 : 0);
  mul *= (pathOf(G).per.power || 1);
  G.power = Math.max(100, Math.round((base + eq + men + bld) * mul));
  if (G.power > G.peakPower) G.peakPower = G.power;
  return G.power;
}
I.calcPower = calcPower;

/* ---------------- 日志 ---------------- */
function jlog(G, parts, k, who) {
  G.journal.unshift({ date: dateOf(G.day).str, parts: parts, k: k || 'plain' });
  if (G.journal.length > 80) G.journal.length = 80;
  var d = who || leadOf(G);
  if (d) {
    d.journal.unshift({ date: dateOf(G.day).str, parts: parts });
    if (d.journal.length > 40) d.journal.length = 40;
  }
}
function effParts(G, e, out) {
  var a = [];
  var num = function (k, n, unit, good) {
    if (!n) return;
    a.push(P((n > 0 ? '多了 ' : '少了 ') + fmt(Math.abs(n)) + ' ' + unit + '。', good ? (n > 0 ? 'good' : 'bad') : (n > 0 ? 'good' : 'bad')));
  };
  if (e.stone) num('stone', e.stone, '灵石');
  if (e.herb) num('herb', e.herb, '药材');
  if (e.ore) num('ore', e.ore, '矿石');
  if (e.fame) num('fame', e.fame, '声望');
  if (e.scroll) num('scroll', e.scroll, '卷残卷');
  if (e.qi) a.push(P('修为涨了 ' + fmt(e.qi) + '。', 'good'));
  if (e.grow) a.push(P('往后每年都练得快一点。', 'good'));
  if (e.power) a.push(P('弟子们打架更有底气了。', 'good'));
  if (e.up) a.push(P('下次突破稳了。', 'good'));
  if (e.loyalty) a.push(P(e.loyalty > 0 ? '弟子们心里舒坦了些。' : '有人小声嘀咕了两句。', e.loyalty > 0 ? 'good' : 'bad'));
  if (e.recruit) {
    var nd = makeDisciple(G);
    G.disciples.push(nd); G.stat.recruits++;
    a.push(P('门口多了个人，说叫 ' + nd.name + '。', 'name'));
    out.recruited = nd.name;
  }
  if (e.item) {
    G.items[e.item] = (G.items[e.item] || 0) + 1;
    var it = D.ITEM_BY_K[e.item];
    a.push(P('袋子里多了' + (it ? it.n : '一件东西') + '。', 'good'));
  }
  if (e.egg && T.EGGS[e.egg] && G.eggs.indexOf(e.egg) < 0) {
    G.eggs.push(e.egg);
    a.push(P('这事后来被记进了宗门志：【' + T.EGGS[e.egg][0] + '】。', 'egg'));
  }
  if (e.flag) G.flags[e.flag] = 1;
  if (e.hurt) a.push(P('有人挂了彩，歇了几天。', 'bad'));
  if (e.risk && rnd(G) < e.risk) {
    G.stone = Math.max(0, G.stone - 12000);
    a.push(P('本来想占个便宜，结果赔了一笔灵石。', 'bad'));
  }
  if (!a.length) a.push(P('什么也没发生，日子照旧过。'));
  return a;
}
function applyEff(G, e, out) {
  var m = { stone: 'stone', herb: 'herb', ore: 'ore', fame: 'fame', scroll: 'scroll', qi: 'qi', purple: 'purple', jade: 'jade' };
  for (var k in m) if (e[k]) G[m[k]] = Math.max(0, G[m[k]] + e[k]);
  if (e.grow) G.growBuff = (G.growBuff || 0) + e.grow;
  if (e.power) G.powerBuff = (G.powerBuff || 0) + e.power;
  if (e.loyalty) alive(G).forEach(function (d) { d.loyalty = clamp(d.loyalty + e.loyalty, 0, 100); });
  if (e.up) G.upBuff = (G.upBuff || 0) + 1;
  calcPower(G);
}

/* ---------------- 建宗门 ---------------- */
I.setup = function (G, o) {
  o = o || {};
  if (G.created) return { ok: false, msg: '山门已经开了。' };
  G.name = String(o.name || '破山门').slice(0, 8);
  G.path = o.path || 'zheng';
  G.master = o.master || 'jian';
  G.partner = o.partner || 'none';
  var p = pathOf(G).start;
  G.stone = p.stone * 60 + 152300; G.herb = p.herb; G.ore = p.ore; G.scroll = p.scroll; G.fame = p.fame;
  if (masterOf(G).per.array) G.buildings.array = 1;
  if (masterOf(G).per.ward) G.buildings.ward = 1;
  G.buildings.dorm = 1;
  var d = makeDisciple(G, { q: D.QUALITY[3] });
  G.disciples.push(d); G.lead = d.uid; G.focus = d.uid; G.formation = [d.uid];
  G.qi = 1279;
  G.created = true;
  G.comboId = (G.seed % 9000) + 1000 + D.PATHS.map(function (x) { return x.k; }).indexOf(G.path) * 17;
  calcPower(G);
  jlog(G, [P(G.name, 'name'), P('挂上了匾。院里就一间殿、两间柴房，', ''), P(d.name, 'name'), P('是第一个上门的人。')], 'good');
  jlog(G, [P('开山长老：' + masterOf(G).n + '。', 'tag'), P('路子定的是' + pathOf(G).n + '，往后怎么走，看你自己。')], 'plain');
  return { ok: true, msg: '开门了' };
};

/* ---------------- 挂机 / 游历 ---------------- */
I.tick = function (G, sec) {
  if (!G.created || G.result) return { ok: false };
  sec = clamp(Number(sec) || 0, 0, 3600);
  if (sec <= 0) return { ok: true };
  var q = qiRateOf(G) * sec * G.speed;
  var max = qiMaxOf(G);
  G.qi = Math.min(max, G.qi + q);
  G.stone += stoneRateOf(G) * sec * G.speed;
  G.fame += (G.buildings.altar || 0) * 0.02 * sec;
  G.day += sec * G.speed;
  G.energyTick = (G.energyTick || 0) + sec;
  if (G.energyTick >= 4) {
    var add = Math.floor(G.energyTick / 4);
    G.energyTick -= add * 4;
    G.energy = Math.min(60 + G.keys * 10, G.energy + add);
  }
  calcPower(G);
  return { ok: true, qi: q };
};

function eventOk(G, ev) {
  var c = ev.cond || {};
  var dt = dateOf(G.day);
  if (c.minYear && dt.y < c.minYear) return false;
  if (c.maxYear && dt.y > c.maxYear) return false;
  if (c.reqFlag && !G.flags[c.reqFlag]) return false;
  if (c.noFlag && G.flags[c.noFlag]) return false;
  if (c.needBuild && !G.buildings[c.needBuild]) return false;
  if (c.minLv && (G.buildings.hall || 0) < c.minLv) return false;
  if (G.recent.indexOf(ev.id) >= 0) return false;
  return true;
}
function findEvent(G) {
  var pool = T.EVENTS.filter(function (e) { return eventOk(G, e); });
  if (!pool.length) { G.recent = []; pool = T.EVENTS.filter(function (e) { return eventOk(G, e); }); }
  if (!pool.length) return null;
  var tot = 0;
  pool.forEach(function (e) { tot += e.w || 10; });
  var r = rnd(G) * tot;
  for (var i = 0; i < pool.length; i++) { r -= pool[i].w || 10; if (r <= 0) return pool[i]; }
  return pool[0];
}
function raise(G, ev) {
  G.recent.unshift(ev.id);
  if (G.recent.length > 7) G.recent.length = 7;
  var opts = ev.opts.map(function (o, i) {
    return { n: o.n, d: o.d, e: o.e || {}, egg: o.egg || '', flag: o.flag || '', risk: o.risk || 0,
      pop: clamp(Math.round((D.POP.opts[i] || 0.2) * 100 + ri(G, -7, 7)), 3, 92) };
  });
  G.pending = { id: ev.id, t: ev.t, who: ev.who || '路上', tag: ev.tag || '日常', x: ev.x, opts: opts,
    date: dateOf(G.day).str, guest: nameOf(G), guestRealm: D.REALMS[clamp(G.realm + ri(G, 0, 1), 0, 9)].n };
  return G.pending;
}

I.travel = function (G, n) {
  if (!G.created) return { ok: false, msg: '还没开门。' };
  if (G.pending) return { ok: false, msg: '眼前这事还没了。' };
  if (G.result) return { ok: false, msg: '这一世已经收尾了。' };
  if (G.energy < 1) return { ok: false, msg: '游历令用完了，等一会儿回一点。' };
  n = n || 1;
  G.energy -= 1;
  I.tick(G, 15 + (hasPet(G, 'he') ? 2 : 0));
  G.stat.travels += n;
  G.fame += 2;
  var lucky = 0.72 + (hasDao(G, 'fu') ? 0.1 : 0);
  if (rnd(G) < lucky) {
    var ev = findEvent(G);
    if (ev) { raise(G, ev); return { ok: true, event: true, msg: '路上撞见一件事。' }; }
  }
  jlog(G, [P(leadOf(G) ? leadOf(G).name : '弟子', 'name'), P('出门走了一趟，' + pick(G, T.FLAVOR))], 'plain');
  return { ok: true, event: false, msg: '走了一趟，平安回来。' };
};

I.choose = function (G, idx) {
  if (!G.pending) return { ok: false, msg: '现在没有要拿主意的事。' };
  var p = G.pending;
  idx = clamp(idx | 0, 0, p.opts.length - 1);
  var o = p.opts[idx];
  var e = {}; for (var k in o.e) e[k] = o.e[k];
  if (o.egg) e.egg = o.egg;
  if (o.flag) e.flag = o.flag;
  if (o.risk) e.risk = o.risk;
  var out = {};
  var tail = effParts(G, e, out);
  applyEff(G, e, out);
  G.stat.chooses[idx] = (G.stat.chooses[idx] || 0) + 1;
  G.pending = null;
  var lead = leadOf(G);
  var parts = [P(lead ? lead.name : '弟子', 'name'), P('行至一处，' + p.x + ' ', '')];
  parts.push(P('【' + o.n + '】', 'tag'));
  tail.forEach(function (q) { parts.push(q); });
  jlog(G, parts, e.egg ? 'egg' : 'event');
  // 选项偶尔掉一件装备 / 道种线索
  if (rnd(G) < 0.22 && lead) {
    var s = pick(G, EQUIP_SLOTS);
    if (!lead.equip[s.k]) {
      lead.equip[s.k] = { lv: 1, q: 1, n: s.n };
      jlog(G, [P('回来的路上捡到一件' + s.n + '，先给', ''), P(lead.name, 'name'), P('挂上了。', 'good')], 'good');
    }
  }
  calcPower(G);
  checkQuest(G);

/* ---------------- 弟子 / 装备 / 道种 / 灵宠 / 布阵 ---------------- */

/* ---------------- 洞府 / 差事 / 商店 / 宗门战 ---------------- */
function buildCost(G, b) {
  var lv = G.buildings[b.k] || 0;
  var m = Math.pow(1.65, lv);
  return { stone: Math.round(b.cost.stone * m), ore: Math.round(b.cost.ore * m + lv * 3) };
}
I.build = function (G, k) {
  var b = D.BUILD_BY_K[k];

  if (lv >= b.max) return { ok: false, msg: '已经盖到顶了。' };
  var hall = G.buildings.hall || 0;
  if (k !== 'dorm' && k !== 'hall' && lv >= hall + D.LEVELS[0].cap) return { ok: false, msg: '大殿等级不够，先升山门大殿。' };
  var c = buildCost(G, b);
  if (G.stone < c.stone || G.ore < c.ore) return { ok: false, msg: '材料不够，要 ' + fmt(c.stone) + ' 灵石 / ' + c.ore + ' 矿。' };
  G.stone -= c.stone; G.ore -= c.ore;
  G.buildings[k] = lv + 1;
  if (k === 'dorm') G.cap = Math.min(20, 3 + G.buildings.dorm * 3);
  jlog(G, [P(b.n, 'good'), P('升到第 ' + (lv + 1) + ' 级。' + b.d)], 'good');
  checkQuest(G); calcPower(G);
  return { ok: true, msg: b.n + ' Lv.' + (lv + 1) };
};
I.task = function (G, k) {

  if (g.ore) G.ore += g.ore;
  if (g.fame) G.fame += g.fame;

  if (g.stone) parts.push(P('灵石 ' + fmt(g.stone * 40) + '，', 'good'));

  if (g.ore) parts.push(P('矿石 ' + g.ore + '，', 'good'));
  if (g.scroll) parts.push(P('残卷 ' + g.scroll + ' 卷，', 'good'));
  if (g.fame) parts.push(P('声望 ' + g.fame + '。', 'good'));

I.buy = function (G, k) {

  G.items[k] = (G.items[k] || 0) + 1;
  if (it.eff.qi) G.qi = Math.min(qiMaxOf(G), G.qi + it.eff.qi);
  if (it.eff.recruit) return I.recruit(G, true);
  if (it.eff.power) G.powerBuff = (G.powerBuff || 0) + it.eff.power;
  if (it.eff.up) G.upBuff = (G.upBuff || 0) + 1;

I.war = function (G, k) {

  if (!en) return { ok: false, msg: '没这场架。' };

  var mine = G.power, foe = en.power * 30 + 800;

/* ---------------- 签到 / 广告 / 任务 ---------------- */
I.sign = function (G, key) {
  key = key || String(G.day);
  if (G.sign.key === key) return { ok: false, msg: '今天已经签过了。' };
  var idx = G.sign.streak % 7;
  var arr = SIGN[idx];
  var gain = [];
  arr.forEach(function (a) {
    if (a.k === 'qi') G.qi = Math.min(qiMaxOf(G), G.qi + a.v * 0.02);
    else G[a.k] = (G[a.k] || 0) + a.v;
    gain.push(a.n + ' ×' + fmt(a.v));
  });
  if (idx === 0 && G.sign.streak > 0) G.sign.got = [];
  G.sign.got[idx] = 1;
  G.sign.streak++; G.sign.total++; G.sign.key = key;
  jlog(G, [P('签到第 ' + G.sign.streak + ' 天，领了 ', ''), P(gain.join('、'), 'good'), P('。')], 'good');
  checkQuest(G);
  return { ok: true, msg: '今日已签到 · ' + gain.join('、'), idx: idx };
};
I.ad = function (G, mode, key) {
  key = key || String(G.day);
  if (G.ad.key !== key) { G.ad.key = key; G.ad.used = 0; }
  if (G.ad.used >= 3) return { ok: false, msg: '今天三次都用完了。' };
  G.ad.used++;
  if (mode === 'recruit') return I.recruit(G, true);
  if (mode === 'scroll') { G.scroll += 3; jlog(G, [P('看完一段，换了 3 卷残卷。', 'good')], 'good'); return { ok: true, msg: '残卷 +3' }; }
  G.stone += 300000; G.jade += 1;
  jlog(G, [P('看完一段，领了 30 万灵石和 1 枚仙玉。', 'good')], 'good');
  return { ok: true, msg: '灵石 +30万 · 仙玉 +1' };
};
function questCur(G, q) {
  if (q.k === 'men2' || q.k === 'men8') return alive(G).length;
  if (q.k === 'break1' || q.k === 'break6') return G.stat.breaks;
  if (q.k === 'travel3') return G.stat.travels;
  if (q.k === 'array1') return G.buildings.array || 0;
  if (q.k === 'sign7') return G.sign.total;
  return 0;
}
function checkQuest(G) {
  var guard = 0;
  while (G.questIdx < QUESTS.length && guard++ < 12) {
    var q = QUESTS[G.questIdx];
    if (questCur(G, q) < q.max) break;
    G.questGot.push(q.k);
    if (q.reward.indexOf('仙玉') >= 0) G.jade += 2;
    else if (q.reward.indexOf('玄晶') >= 0) G.purple += 200;
    else G.stone += 200000;
    jlog(G, [P('办成了：' + q.n + '。', 'good'), P('领到 ' + q.reward + '。', 'good')], 'good');
    G.questIdx++;
  }
}

I.restart = function (seed) { return I.create(seed == null ? Date.now() : seed); };

};

I.offline = function (G, now) {

  var q = qiRateOf(G) * hours * 12;
  G.qi = Math.min(qiMaxOf(G), G.qi + q);
  var s = stoneRateOf(G) * hours * 12;
  G.stone += s;
  G.day += hours * 3;
  G.energy = Math.min(60 + G.keys * 10, G.energy + hours * 2);

/* ---------------- 榜单 ---------------- */
function rankList(G) {

      i: i + 1, name: RANK_SUR[(G.seed + i * 3) % RANK_SUR.length] + '家',
      title: RANK_TITLE[(G.seed + i * 5) % RANK_TITLE.length],
      power: Math.round(1.2e9 + f * 5.2e12 / (1 + i * 0.55)),
      mul: (1 + i * 0.1).toFixed(2)
    });
  }
  list.sort(function (a, b) { return b.power - a.power; });
  list.forEach(function (x, i) { x.i = i + 1; x.powerFmt = fmt(x.power); });
  return list;
}
function sectRank(G) {

      title: pick({ rs: r }, ['名门', '隐宗', '巨擘', '财主']),

  list.sort(function (a, b) { return b.power - a.power; });

}

    '<button class="btn" onclick="UI.close()">返回</button></div>';
  h += '<div class="mini" style="margin-top:7px">存档码通常十几 KB，聊天框容易被截断，<b>优先用文件</b>；' +
    '复制码适合贴进网盘笔记或备忘录。导出后再导入同一份，进度不会丢。</div>';
  return h + '</div></div>' + xclose();
}
function adHtml(v) {
  return '<div class="card setup"><h2>机 缘 奖 励</h2>' +
    '<div class="lead">今天还能看 ' + v.ad.left + ' 次（小程序端接激励视频）<br>选一样，看完就能领。</div>' +
    '<div class="pick">' + [['recruit', '白招一人'], ['double', '一笔资源'], ['scroll', '三卷残卷']].map(function (m) {
      return '<div class="pk' + (adMode === m[0] ? ' on' : '') + '" onclick="UI.adMode(\'' + m[0] + '\')">' +
        '<div class="t">' + m[1] + '</div></div>';
    }).join('') + '</div>' +
    '<div class="foot"><button class="btn gold" onclick="UI.adDone()">看完了，领</button>' +
    '<button class="btn" onclick="UI.close()">算了</button></div></div>';
}
function warHtml() {
  return '<div class="ev"><div class="cap"><div class="sun"></div><div class="ttl">战报</div></div>' +
    '<div class="body" style="padding-top:16px">' + (warWin ? '打赢了。' : '没打过。') + '「' + esc(warTitle) + '」<br><br>' +
    (warLines || []).map(function (p) { return parts([p]) + '<br>'; }).join('') + '</div>' +
    '<button class="opt" onclick="UI.close()">知道了</button></div>';
}
function offlineHtml(v) {
  var o = v.offline;
  return '<div class="ev"><div class="cap"><div class="sun"></div><div class="ttl">挂机</div></div>' +
    '<div class="body" style="padding-top:18px">你不在的 ' + o.hours + ' 小时里，弟子们自己练功、种田、下矿，没人偷懒（大概）。<br><br>' +
    '修为 +' + esc(o.qi) + '　灵石 +' + esc(o.stone) + '</div>' +
    '<button class="opt" onclick="UI.dismissOffline()">收下</button></div>';
}
function resultHtml(v) {
  var r = v.result;
  var h = '<div class="card rst"><div class="big" style="color:' + esc(r.c) + '">' + esc(r.n) + '</div>' +
    '<div class="sub">' + esc(r.d) + ' · 第 ' + r.gen + ' 代 · ' + r.years + ' 年</div>' +
    '<div class="ep">' + esc(r.ep) + '</div>' +
    '<div class="nums"><div><div class="v">' + esc(r.powerFmt) + '</div><div class="k">最终战力</div></div>' +
      '<div><div class="v">' + r.breaks + '</div><div class="k">突破次数</div></div>' +
      '<div><div class="v">' + r.eggs + '</div><div class="k">彩蛋</div></div>' +
      '<div><div class="v">' + r.disciples + '</div><div class="k">在册弟子</div></div></div>' +
    '<div class="pct"><div class="p">大约 ' + esc(r.matchPct) + ' 的人和你一样</div>' +
      '<div class="t">走法 #' + r.comboId + ' · ' + esc(r.route) + ' · ' + esc(r.style) + '</div></div>' +
    '<div class="kv"><span>最强弟子</span><b>' + esc(r.top) + '（' + esc(r.topRealm) + '）</b></div>' +
    '<div class="kv"><span>你选过最冷门一档</span><b>' + esc(r.style) + '</b></div>' +
    '<div class="kv"><span>撞见的彩蛋</span><b>' + (r.eggList.length ? esc(r.eggList.join('、')) : '一个也没有') + '</b></div>' +
    '<div class="foot"><button class="btn gold" onclick="UI.peekResult()">回山门看看</button>' +
    '<button class="btn" onclick="UI.restart()">彻底重开</button></div></div>';
  return h;
}

/* ---------------- 交互 ---------------- */
UI.open = function (p) { open(p); };
UI.close = function () { close(); };
UI.sub = function (s) { sub = s; render(); };
UI.rankTab = function (n) { rankTab = n; render(); };
UI.pick = function (k, val) { pickBuf[k] = val; render(); };
UI.setName = function (val) { pickBuf.name = val; };
UI.start = function () {
  var inp = $('sectName');
  if (inp) pickBuf.name = inp.value || '破山门';
  after(I.setup(G, pickBuf));
  toast('开门了。点中间的大圆出去游历。');
};
UI.travel = function () { after(I.travel(G), false); };
UI.choose = function (i) { after(I.choose(G, i), true); };
UI.eye = function () { toast('这是 ' + (G.pending ? G.pending.who : '路上') + ' 找上门的事，选错了也有后续。'); };
UI.breakthrough = function () { after(I.breakthrough(G)); };
UI.openDisc = function (uid) {
  I.focus(G, uid || G.lead); sub = 'attr'; open('disciple');
};
UI.equip = function (k) { after(I.equip(G, k)); };
UI.dao = function (k) { after(I.dao(G, k)); };
UI.pet = function (k) { after(I.pet(G, k)); };
UI.formation = function (uid) { after(I.formation(G, uid), true); };
UI.build = function (k) { after(I.build(G, k)); };
UI.task = function (k) { after(I.task(G, k)); };
UI.buy = function (k) { after(I.buy(G, k)); };
UI.recruit = function () { after(I.recruit(G, false)); };
UI.war = function (k) {
  var r = I.war(G, k);
  if (!r.ok) { toast(r.msg); return; }
  warLines = r.lines; warTitle = r.title; warWin = r.win;
  save(); open('war');
};
UI.sign = function () { after(I.sign(G, dayKey())); };
UI.adMode = function (m) { adMode = m; render(); };
UI.adDone = function () { var r = I.ad(G, adMode, dayKey()); if (r.ok) close(); after(r); };
UI.setAuto = function (on) { after(I.setAuto(G, on), true); };
UI.setSpeed = function (n) { after(I.setSpeed(G, n), true); };
UI.dismissOffline = function () { I.dismissOffline(G); save(); render(); };
UI.retire = function () { after(I.retire(G), true); };
UI.peekResult = function () { I.peekResult(G); panel = ''; save(); render(); };
UI.restart = function () {
  G = I.restart(Date.now()); panel = ''; sub = 'attr'; lastKey = '?';
  save(); render(); toast('重开了一局。');
};

/* ---------------- 存档导出 / 导入（网吧换机续玩） ---------------- */
UI.saveInput = function (v) { saveBox = v; };
UI.copySave = function () {
  var el = $('saveCode');
  if (!el) return;
  el.focus(); el.select();
  var done = false;
  try { done = document.execCommand('copy'); } catch (e) {}
  if (!done && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value).then(
      function () { toast('存档码已复制，粘到网盘笔记里'); },
      function () { toast('复制失败，请手动全选复制'); }
    );
    return;
  }
  toast(done ? '存档码已复制，粘到网盘笔记里' : '复制不了，请手动全选复制');
};
UI.exportSave = function () {
  try {
    var blob = new Blob(['\uFEFF' + saveText()], { type: 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fileName(); a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function () {
      try { document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) {}
    }, 800);
    saveBox = null;
    toast('存档文件已下载，记得传到网盘或发给自己');
  } catch (e) {
    toast('这台浏览器不让下载，改用「复制框里存档码」');
  }
};
UI.applySave = function (txt) {
  var g = parseSave(txt);
  if (!g) { toast('读不出来：不是本游戏存档，或版本对不上'); return null; }
  G = g; saveBox = null; panel = ''; sub = 'attr'; lastKey = '?';
  save(); render();
  toast('存档读回来了，接着玩');
  return I.view(G);
};
UI.importFile = function (el) {
  var f = el && el.files && el.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () { UI.applySave(r.result); };
  r.onerror = function () { toast('文件读不出来'); };
  r.readAsText(f, 'utf-8');
  try { el.value = ''; } catch (e) {}
};
UI.importBox = function () {
  var el = $('saveCode');
  UI.applySave(el ? el.value : (saveBox == null ? '' : saveBox));
};
UI.wipe = function () {
  try { localStorage.removeItem(I.SAVE_KEY); } catch (e) {}
  G = I.create(Date.now()); saveBox = null; panel = ''; sub = 'attr'; lastKey = '?';
  render(); toast('本机记录清空了，关掉浏览器就行');
};

/* ---------------- 定时挂机 ---------------- */
function tick() {
  if (!G) return;
  I.tick(G, 0.5);
  if (G.auto && !G.pending && !G.result && G.energy > 0) {
    autoAcc += 0.5;
    if (autoAcc >= 2) {
      autoAcc = 0;
      var r = I.travel(G);
      if (r.ok) save();
    }
  }
  var v = I.view(G);
  renderHud(v);
  var k = modalKey(v);
  if (k !== lastKey) renderModal(v, k);
  saveAcc += 0.5;
  if (saveAcc >= 5) { saveAcc = 0; save(); }
}

/* ---------------- 截图 / 调试接口 ---------------- */
window.__SUI = {
  view: function () { return I.view(G); },
  state: function () { return G; },
  act: function (t, p) {
    p = p || {};
    var map = {
      travel: function () { return I.travel(G, p.n); },
      choose: function () { return I.choose(G, p.idx || 0); },
      breakthrough: function () { return I.breakthrough(G); },
      recruit: function () { return I.recruit(G, p.free !== false); },
      build: function () { return I.build(G, p.k); },
      task: function () { return I.task(G, p.k); },
      buy: function () { return I.buy(G, p.k); },
      equip: function () { return I.equip(G, p.k); },
      dao: function () { return I.dao(G, p.k); },
      pet: function () { return I.pet(G, p.k); },
      formation: function () { return I.formation(G, p.uid); },
      sign: function () { return I.sign(G, p.key || dayKey()); },
      ad: function () { return I.ad(G, p.mode || 'recruit', p.key || dayKey()); },
      war: function () { return I.war(G, p.k); },
      retire: function () { return I.retire(G); }
    };
    var r = map[t] ? map[t]() : { ok: false, msg: 'no action' };
    save(); render();
    return r;
  },
  setup: function (o) {
    o = o || {};
    G = I.create(o.seed || 20261106);
    I.setup(G, { name: o.name || '青崖', path: o.path || 'zheng', master: o.master || 'zhen', partner: o.partner || 'yi' });
    panel = ''; sub = 'attr'; lastKey = '?';
    save(); render();
    return I.view(G);
  },
  clear: function () { try { localStorage.removeItem(I.SAVE_KEY); } catch (e) {} },
  fast: function (n) {
    for (var i = 0; i < (n || 5); i++) {
      if (G.pending) I.choose(G, i % 3);
      else I.travel(G);
    }
    save(); render();
  },
  finish: function () {
    for (var i = 0; i < 200 && !G.result; i++) {
      if (G.pending) I.choose(G, i % 3);
      else { G.energy = 60; I.travel(G); }
    }
    if (!G.result) I.retire(G);
    save(); render();
  },
  give: function (k, val) { G[k] = val; I.calcPower(G); save(); render(); },
  saveText: saveText,
  parseSave: function (t) { var g = parseSave(t); return g ? I.view(g) : null; },
  importText: function (t) { return UI.applySave(t); },
  storageOK: function () { return STORAGE_OK; },
  wipe: function () { UI.wipe(); },
  open: function (p) { open(p); },
  panel: function (p, s) { panel = p; if (s) sub = s; render(); },
  render: render
};

/* ---------------- 启动 ---------------- */
G = load();
STORAGE_OK = storageOK();
I.offline(G, Date.now());
render();
if (!STORAGE_OK) {
  setTimeout(function () { toast('这台电脑不能自动存档：下机前一定导出存档文件'); }, 900);
}
if (tickTimer) clearInterval(tickTimer);
tickTimer = setInterval(tick, 500);
window.UI = UI;
</script>
</body>
</html>
